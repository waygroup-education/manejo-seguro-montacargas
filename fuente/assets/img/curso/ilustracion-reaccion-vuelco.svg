<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img"
     aria-label="Dos montacargas vistos de frente, con la carga elevada, se inclinan hacia el mismo costado. A la izquierda, el instinto natural: el operador salta fuera de la cabina, y una señal de prohibido lo tacha: no saltar. A la derecha, la reacción correcta: el operador se queda dentro, sujeto al volante con las dos manos, con los pies dentro y el cuerpo inclinado en dirección contraria al vuelco.">
  <!-- Ilustración explicativa · Waygroup · Manejo Seguro de Montacargas, tema 4 (apertura)
       Concepto (DI, Situación de partida del tema 4): el instinto de saltar para alejarse de un
       montacargas que vuelca es exactamente lo que puede convertir un incidente en una tragedia;
       la reacción correcta contradice ese instinto. Reacción correcta (DI tabla 4.3): «Sujetarse
       al volante, mantener los pies dentro, inclinarse en dirección contraria, no saltar.»
       Guion en insumos/ILUSTRACIONES.md. Familia: ilustracion-reparto-peso.svg (tema 1).
       Naranja (acento del preset vital) = la reacción correcta: el operador que se queda dentro.
       No dibuja el triángulo de estabilidad ni el centro de gravedad (Figura 3), ni lesiones. -->
  <defs>
    <linearGradient id="ilu-reaccion-vuelco-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF4F8"/>
    </linearGradient>
    <pattern id="ilu-reaccion-vuelco-puntos-naranja" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#F97316"/>
    </pattern>
    <pattern id="ilu-reaccion-vuelco-puntos-navy" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#082F49"/>
    </pattern>

    <!-- Montacargas visto de frente, en coordenadas locales (origen en el suelo, al centro).
         «atras»: el asiento, que queda detrás del operador. -->
    <g id="ilu-reaccion-vuelco-atras">
      <rect x="-44" y="-292" width="88" height="118" rx="14" fill="#1E4763"/>
      <rect x="-50" y="-186" width="100" height="24" rx="8" fill="#1E4763"/>
    </g>
    <!-- «delante»: chasis, ruedas, columna y volante, techo protector, mástil y carga elevada -->
    <g id="ilu-reaccion-vuelco-delante">
      <!-- Chasis -->
      <rect x="-66" y="-64" width="132" height="48" rx="6" fill="#1E4763"/>
      <rect x="-116" y="-126" width="232" height="72" rx="12" fill="#082F49"/>
      <rect x="-116" y="-126" width="232" height="9" rx="4" fill="#1E4763"/>
      <!-- Ruedas -->
      <rect x="-112" y="-76" width="44" height="76" rx="13" fill="#0B1B26" stroke="#F1F6F9" stroke-width="6"/>
      <rect x="68" y="-76" width="44" height="76" rx="13" fill="#0B1B26" stroke="#F1F6F9" stroke-width="6"/>
      <!-- Columna y volante -->
      <line x1="0" y1="-124" x2="0" y2="-208" stroke="#0B1B26" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="0" cy="-214" rx="36" ry="10" fill="none" stroke="#0B1B26" stroke-width="8"/>
      <!-- Techo protector -->
      <path d="M-98 -122 L-98 -324 M98 -122 L98 -324" stroke="#082F49" stroke-width="9" stroke-linecap="round"/>
      <line x1="-112" y1="-326" x2="112" y2="-326" stroke="#082F49" stroke-width="11" stroke-linecap="round"/>
      <!-- Mástil -->
      <rect x="-80" y="-440" width="14" height="400" rx="3" fill="#0B1B26"/>
      <rect x="66" y="-440" width="14" height="400" rx="3" fill="#0B1B26"/>
      <rect x="-80" y="-444" width="160" height="11" rx="3" fill="#0B1B26"/>
      <!-- Carga elevada sobre las horquillas -->
      <rect x="-92" y="-360" width="184" height="12" rx="3" fill="#0B1B26"/>
      <rect x="-88" y="-422" width="176" height="62" rx="5" fill="#CBD5E1"/>
      <rect x="-88" y="-422" width="176" height="9" rx="4" fill="#E2E8F0"/>
      <line x1="0" y1="-413" x2="0" y2="-360" stroke="#94A3B8" stroke-width="6"/>
    </g>

    <!-- Flecha de trazo (punta a la izquierda del final de un path) -->
    <marker id="ilu-reaccion-vuelco-punta-navy" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#082F49"/>
    </marker>
    <marker id="ilu-reaccion-vuelco-punta-gris" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="480" rx="20" fill="url(#ilu-reaccion-vuelco-fondo)"/>

  <!-- Detalles de la familia del diseñador: tramas de puntos y un aro -->
  <rect x="46" y="44" width="90" height="72" fill="url(#ilu-reaccion-vuelco-puntos-naranja)" opacity=".45"/>
  <rect x="1070" y="44" width="90" height="72" fill="url(#ilu-reaccion-vuelco-puntos-navy)" opacity=".25"/>
  <circle cx="530" cy="70" r="9" fill="none" stroke="#F97316" stroke-width="3" opacity=".7"/>

  <!-- Separador entre las dos escenas -->
  <line x1="560" y1="80" x2="560" y2="420" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- Suelo -->
  <line x1="84" y1="370" x2="516" y2="370" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="604" y1="370" x2="1156" y2="370" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- ══════ INSTINTO NATURAL: saltar ══════ -->
  <g>
    <!-- Hacia dónde vuelca -->
    <path d="M258 66 Q318 56 340 116" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#ilu-reaccion-vuelco-punta-gris)"/>

    <!-- El montacargas se inclina hacia un costado; la cabina queda vacía -->
    <g transform="translate(200 370) scale(.66)">
      <g transform="rotate(10 112 0)">
        <use href="#ilu-reaccion-vuelco-atras"/>
        <use href="#ilu-reaccion-vuelco-delante"/>
      </g>
    </g>

    <!-- Trayectoria del salto -->
    <g stroke="#94A3B8" stroke-width="4" stroke-linecap="round">
      <line x1="316" y1="196" x2="340" y2="206"/>
      <line x1="312" y1="222" x2="334" y2="230"/>
      <line x1="316" y1="248" x2="336" y2="254"/>
    </g>

    <!-- El operador, fuera de la cabina, en el aire -->
    <g transform="translate(406 238) rotate(-14)" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-24" y="-14" width="50" height="28" rx="14" fill="#64748B"/>
      <circle cx="42" cy="-4" r="14" fill="#64748B"/>
      <path d="M26 -8 A16 16 0 0 1 56 -12 Z" fill="#94A3B8"/>
      <path d="M20 -8 L38 -30 L56 -40 M20 6 L42 -6 L62 -10" fill="none" stroke="#64748B" stroke-width="11"/>
      <path d="M-20 -6 L-42 -22 L-50 4 M-20 8 L-46 18 L-66 10" fill="none" stroke="#64748B" stroke-width="12"/>
    </g>

    <!-- No saltar -->
    <g fill="none" stroke="#082F49" stroke-width="8" stroke-linecap="round">
      <circle cx="404" cy="240" r="64"/>
      <line x1="359" y1="195" x2="449" y2="285"/>
    </g>
  </g>

  <!-- ══════ REACCIÓN CORRECTA: quedarse dentro ══════ -->
  <g>
    <!-- Hacia dónde vuelca -->
    <path d="M928 66 Q988 56 1010 116" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#ilu-reaccion-vuelco-punta-gris)"/>

    <g transform="translate(870 370) scale(.66)">
      <g transform="rotate(10 112 0)">
        <use href="#ilu-reaccion-vuelco-atras"/>
        <!-- Tronco y cabeza, inclinados en dirección contraria al vuelco -->
        <g transform="rotate(-22 0 -182)" fill="#F97316">
          <path d="M-22 -180 L-29 -246 Q-30 -258 -18 -258 L18 -258 Q30 -258 29 -246 L22 -180 Z"/>
          <circle cx="0" cy="-282" r="19"/>
          <path d="M-22 -286 A22 22 0 0 1 22 -286 L26 -286 Q26 -292 20 -292 L-20 -292 Z" fill="#FDBA74"/>
        </g>
        <use href="#ilu-reaccion-vuelco-delante"/>
        <!-- Piernas y pies, dentro de la cabina -->
        <g stroke="#F97316" stroke-width="17" stroke-linecap="round" fill="none">
          <line x1="-18" y1="-172" x2="-21" y2="-134"/>
          <line x1="18" y1="-172" x2="21" y2="-134"/>
        </g>
        <circle cx="-18" cy="-176" r="14" fill="#F97316"/>
        <circle cx="18" cy="-176" r="14" fill="#F97316"/>
        <rect x="-38" y="-138" width="30" height="14" rx="6" fill="#F97316"/>
        <rect x="8" y="-138" width="30" height="14" rx="6" fill="#F97316"/>
        <!-- Brazos: las dos manos sujetas al volante -->
        <g stroke="#F97316" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M-48 -238 L-52 -222 L-36 -214"/>
          <path d="M-4 -256 L28 -238 L36 -216"/>
        </g>
        <circle cx="-36" cy="-214" r="10" fill="#F97316"/>
        <circle cx="36" cy="-214" r="10" fill="#F97316"/>
      </g>
    </g>

    <!-- Inclinarse en dirección contraria -->
    <path d="M866 150 Q826 128 780 158" fill="none" stroke="#082F49" stroke-width="5" stroke-linecap="round" marker-end="url(#ilu-reaccion-vuelco-punta-navy)"/>

    <!-- Líneas de rótulo -->
    <g stroke="#94A3B8" stroke-width="2">
      <line x1="994" y1="214" x2="926" y2="221"/>
      <line x1="994" y1="298" x2="908" y2="280"/>
    </g>
    <g fill="#94A3B8">
      <circle cx="926" cy="221" r="4"/>
      <circle cx="908" cy="280" r="4"/>
    </g>
  </g>

  <!-- Rótulos: solo palabras literales del DI -->
  <g font-family="'Space Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#334155">
    <text x="404" y="346" text-anchor="middle">no saltar</text>
    <text x="596" y="102">inclinarse en</text>
    <text x="596" y="130">dirección contraria</text>
    <text x="1004" y="210">sujetarse</text>
    <text x="1004" y="236">al volante</text>
    <text x="1004" y="296">mantener los</text>
    <text x="1004" y="322">pies dentro</text>
  </g>
  <g font-family="'Space Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-size="30" font-weight="700" fill="#082F49">
    <text x="300" y="450">instinto natural</text>
    <text x="880" y="450">reacción correcta</text>
  </g>
</svg>
