<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img"
     aria-label="Un carro arriba y un montacargas abajo, de perfil. Sobre el carro, el peso cae parejo a lo largo de todo el vehículo, de la rueda delantera a la trasera. Sobre el montacargas, el peso se concentra en dos puntos: adelante, en la carga que llevan las horquillas, y atrás, en el contrapeso; en el medio no hay nada.">
  <!-- Ilustración explicativa · Waygroup · Manejo Seguro de Montacargas, tema 1 (apertura)
       VARIANTE MÓVIL de ilustracion-reparto-peso.svg (1200×440): mismo guion, mismas formas
       (copiadas sin cambios, solo trasladadas), mismos colores. Composición vertical para que
       los rótulos se lean a 320 px de columna (principio 8 de Waygroup).
       Concepto (DI 1.2): en un carro el peso se distribuye de manera uniforme entre las cuatro
       ruedas; en un montacargas la carga se concentra en la parte delantera, equilibrándose
       gracias a un contrapeso situado en la zona posterior.
       Guion en insumos/ILUSTRACIONES.md. Naranja (acento del preset vital) = el peso.
       No dibuja el triángulo de estabilidad ni el centro de gravedad (Figura 3) ni las partes
       rotuladas del montacargas (Figura 2). -->
  <defs>
    <linearGradient id="ilu-reparto-peso-m-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF4F8"/>
    </linearGradient>
    <pattern id="ilu-reparto-peso-m-puntos-naranja" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#F97316"/>
    </pattern>
    <pattern id="ilu-reparto-peso-m-puntos-navy" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#082F49"/>
    </pattern>
    <!-- Una flecha de peso, sin valor: 60 de largo, punta abajo -->
    <g id="ilu-reparto-peso-m-flecha">
      <line x1="0" y1="0" x2="0" y2="44" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <path d="M-10 42 L0 60 L10 42 Z" fill="#F97316" stroke="#F97316" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="600" height="720" rx="20" fill="url(#ilu-reparto-peso-m-fondo)"/>

  <!-- Detalles de la familia del diseñador: tramas de puntos y un aro -->
  <rect x="28" y="30" width="72" height="54" fill="url(#ilu-reparto-peso-m-puntos-naranja)" opacity=".45"/>
  <rect x="500" y="30" width="72" height="54" fill="url(#ilu-reparto-peso-m-puntos-navy)" opacity=".25"/>
  <circle cx="64" cy="336" r="9" fill="none" stroke="#F97316" stroke-width="3" opacity=".7"/>

  <!-- Separador entre las dos escenas -->
  <line x1="96" y1="336" x2="540" y2="336" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- ══════ CARRO (arriba): el peso, parejo de una rueda a la otra ══════
       Formas idénticas a la versión de escritorio, trasladadas. -->
  <g transform="translate(0 -72)">
    <!-- Suelo -->
    <line x1="92" y1="330" x2="510" y2="330" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Peso repartido de manera uniforme -->
    <line x1="196" y1="112" x2="404" y2="112" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(200 112)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(250 112)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(300 112)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(350 112)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(400 112)"/>

    <!-- Carrocería, de perfil, mirando a la izquierda -->
    <path d="M140 294 Q128 294 128 282 L128 264 Q128 248 146 245 L218 236 Q232 234 242 224 L272 196 Q280 188 292 188 L372 188 Q384 188 392 198 L420 232 Q426 238 436 240 L456 244 Q472 248 472 264 L472 282 Q472 294 460 294 Z"
          fill="#082F49"/>
    <path d="M254 228 L282 202 Q286 198 292 198 L326 198 L326 228 Z" fill="#D6ECF8"/>
    <path d="M336 198 L370 198 Q376 198 380 203 L400 228 L336 228 Z" fill="#D6ECF8"/>
    <rect x="130" y="256" width="14" height="8" rx="3" fill="#D6ECF8"/>

    <!-- Ruedas -->
    <circle cx="200" cy="296" r="34" fill="#0B1B26" stroke="#F1F6F9" stroke-width="7"/>
    <circle cx="200" cy="296" r="12" fill="#CBD5E1"/>
    <circle cx="400" cy="296" r="34" fill="#0B1B26" stroke="#F1F6F9" stroke-width="7"/>
    <circle cx="400" cy="296" r="12" fill="#CBD5E1"/>
  </g>

  <!-- ══════ MONTACARGAS (abajo): la carga adelante, el contrapeso atrás ══════
       Formas idénticas a la versión de escritorio, trasladadas. -->
  <g transform="translate(-582 272)">
    <!-- Suelo -->
    <line x1="652" y1="330" x2="1128" y2="330" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Peso concentrado adelante, sobre la carga -->
    <line x1="706" y1="152" x2="774" y2="152" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(712 152)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(740 152)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(768 152)"/>

    <!-- Peso atrás, sobre el contrapeso -->
    <line x1="1006" y1="140" x2="1072" y2="140" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(1012 140)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(1039 140)"/>
    <use href="#ilu-reparto-peso-m-flecha" transform="translate(1066 140)"/>

    <!-- Techo protector -->
    <path d="M848 246 L868 134 L976 134 L984 214" fill="none" stroke="#082F49" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Asiento -->
    <path d="M934 244 L934 200 Q934 192 942 192 L962 192 Q970 192 970 200 L970 244 Z" fill="#1E4763"/>
    <!-- Chasis -->
    <path d="M822 300 L822 254 Q822 246 830 246 L996 246 L996 300 Z" fill="#082F49"/>
    <!-- Contrapeso (zona posterior) -->
    <path d="M990 212 L1050 212 Q1080 212 1082 242 L1084 290 Q1084 302 1072 302 L990 302 Z" fill="#F97316"/>
    <path d="M990 212 L1050 212 Q1064 212 1072 218 L990 218 Z" fill="#FDBA74" opacity=".8"/>
    <!-- Mástil y porta-horquillas -->
    <rect x="804" y="96" width="18" height="222" rx="3" fill="#082F49"/>
    <rect x="792" y="226" width="14" height="94" rx="3" fill="#0B1B26"/>
    <!-- Horquillas -->
    <rect x="680" y="312" width="126" height="8" rx="3" fill="#082F49"/>
    <!-- Carga (parte delantera) -->
    <rect x="694" y="226" width="92" height="86" rx="5" fill="#F97316"/>
    <rect x="694" y="226" width="92" height="10" rx="5" fill="#FDBA74" opacity=".8"/>
    <line x1="740" y1="236" x2="740" y2="312" stroke="#EA580C" stroke-width="6"/>

    <!-- Ruedas -->
    <circle cx="862" cy="294" r="36" fill="#0B1B26" stroke="#F1F6F9" stroke-width="7"/>
    <circle cx="862" cy="294" r="13" fill="#CBD5E1"/>
    <circle cx="1040" cy="302" r="28" fill="#0B1B26" stroke="#F1F6F9" stroke-width="7"/>
    <circle cx="1040" cy="302" r="10" fill="#CBD5E1"/>
  </g>

  <!-- Rótulos: solo palabras literales del DI. En coordenadas raíz (sin escalar):
       partes a 30 u (16 px a 320 px de ancho), vehículos a 38 u (20 px). -->
  <g font-family="'Space Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="300" y="304" font-size="38" font-weight="700" fill="#082F49">carro</text>
    <text x="158" y="644" font-size="30" font-weight="600" fill="#334155">carga</text>
    <text x="458" y="644" font-size="30" font-weight="600" fill="#334155">contrapeso</text>
    <text x="300" y="694" font-size="38" font-weight="700" fill="#082F49">montacargas</text>
  </g>
</svg>
