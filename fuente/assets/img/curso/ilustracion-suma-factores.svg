<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"
     aria-label="Una delgada línea horizontal cruza la imagen: debajo, maniobra segura; encima, vuelco inminente. A la izquierda, de forma aislada, tres bloques separados —manejo de la carga, velocidad en giros y frenado intempestivo— y ninguno llega a la línea. A la derecha, los mismos tres bloques apilados, en naranja: juntos pasan la línea. Es el efecto combinatorio.">
  <!-- Ilustración explicativa · Waygroup · Manejo Seguro de Montacargas, tema 2 (apertura)
       Concepto (DI 2.2): cada uno de estos factores, de forma aislada, podría no ser suficiente
       para desplazar el montacargas fuera de su triángulo de estabilidad; el verdadero peligro
       radica en el efecto combinatorio, la delgada línea que separa una maniobra segura de un
       vuelco inminente. Factores: los tres títulos del carrusel de 2.2.
       Guion en insumos/ILUSTRACIONES.md. Naranja (acento del preset vital) = la combinación.
       No dibuja escenarios de giro, triángulo de estabilidad ni centro de gravedad (Figura 7)
       ni categorías de peligro (Figura 6). Sin cifras: las alturas no son valores. -->
  <defs>
    <linearGradient id="ilu-suma-factores-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF4F8"/>
    </linearGradient>
    <pattern id="ilu-suma-factores-puntos-naranja" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#F97316"/>
    </pattern>
    <pattern id="ilu-suma-factores-puntos-navy" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#082F49"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" rx="20" fill="url(#ilu-suma-factores-fondo)"/>

  <!-- Detalles de la familia del diseñador: tramas de puntos y un aro -->
  <rect x="46" y="44" width="90" height="72" fill="url(#ilu-suma-factores-puntos-naranja)" opacity=".45"/>
  <rect x="1070" y="36" width="90" height="72" fill="url(#ilu-suma-factores-puntos-navy)" opacity=".25"/>
  <circle cx="560" cy="70" r="9" fill="none" stroke="#F97316" stroke-width="3" opacity=".7"/>

  <!-- Separador entre las dos escenas -->
  <line x1="600" y1="240" x2="600" y2="420" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- Suelo -->
  <line x1="72" y1="340" x2="568" y2="340" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <line x1="652" y1="340" x2="1128" y2="340" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- ══════ DE FORMA AISLADA: cada factor por separado, ninguno llega a la línea ══════ -->
    <g>
      <rect x="95.0" y="244" width="130" height="96" rx="7" fill="#082F49"/>
      <rect x="95.0" y="244" width="130" height="9" rx="7" fill="#1E4763" opacity=".8"/>
      <rect x="134.0" y="270.0" width="28" height="17" rx="2" fill="#F8FAFC"/>
      <rect x="134.0" y="290.0" width="28" height="17" rx="2" fill="#F8FAFC"/>
      <line x1="129.0" y1="312.0" x2="165.0" y2="312.0" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <line x1="179.0" y1="312.0" x2="179.0" y2="283.0" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <path d="M170.0 285.0 L179.0 271.0 L188.0 285.0 Z" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="255.0" y="252" width="130" height="88" rx="7" fill="#082F49"/>
      <rect x="255.0" y="252" width="130" height="9" rx="7" fill="#1E4763" opacity=".8"/>
      <path d="M339.0 301.0 A19 19 0 1 1 319.0 282.0" fill="none" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M317.0 271.0 L332.0 282.0 L317.0 293.0 Z" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="415.0" y="260" width="130" height="80" rx="7" fill="#082F49"/>
      <rect x="415.0" y="260" width="130" height="9" rx="7" fill="#1E4763" opacity=".8"/>
      <circle cx="480.0" cy="303.0" r="15" fill="none" stroke="#F8FAFC" stroke-width="5"/>
      <path d="M456.0 287.0 A24 24 0 0 0 456.0 319.0" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <path d="M504.0 287.0 A24 24 0 0 1 504.0 319.0" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <line x1="480.0" y1="295.0" x2="480.0" y2="305.0" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="480.0" cy="311.0" r="2.6" fill="#F8FAFC"/>
    </g>

  <!-- La delgada línea: debajo, maniobra segura; encima, vuelco inminente -->
  <line x1="60" y1="190" x2="1140" y2="190" stroke="#082F49" stroke-width="3" stroke-linecap="round"/>

  <!-- ══════ EFECTO COMBINATORIO: los mismos tres, juntos, pasan la línea (van delante de ella) ══════ -->
    <g>
      <rect x="795.0" y="244" width="130" height="96" rx="7" fill="#F97316"/>
      <rect x="795.0" y="244" width="130" height="9" rx="7" fill="#FDBA74" opacity=".8"/>
      <rect x="834.0" y="270.0" width="28" height="17" rx="2" fill="#F8FAFC"/>
      <rect x="834.0" y="290.0" width="28" height="17" rx="2" fill="#F8FAFC"/>
      <line x1="829.0" y1="312.0" x2="865.0" y2="312.0" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <line x1="879.0" y1="312.0" x2="879.0" y2="283.0" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <path d="M870.0 285.0 L879.0 271.0 L888.0 285.0 Z" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="795.0" y="150" width="130" height="88" rx="7" fill="#F97316"/>
      <rect x="795.0" y="150" width="130" height="9" rx="7" fill="#FDBA74" opacity=".8"/>
      <path d="M879.0 199.0 A19 19 0 1 1 859.0 180.0" fill="none" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M857.0 169.0 L872.0 180.0 L857.0 191.0 Z" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="795.0" y="64" width="130" height="80" rx="7" fill="#F97316"/>
      <rect x="795.0" y="64" width="130" height="9" rx="7" fill="#FDBA74" opacity=".8"/>
      <circle cx="860.0" cy="107.0" r="15" fill="none" stroke="#F8FAFC" stroke-width="5"/>
      <path d="M836.0 91.0 A24 24 0 0 0 836.0 123.0" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <path d="M884.0 91.0 A24 24 0 0 1 884.0 123.0" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
      <line x1="860.0" y1="99.0" x2="860.0" y2="109.0" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="860.0" cy="115.0" r="2.6" fill="#F8FAFC"/>
    </g>

  <!-- Rótulos: solo palabras literales del DI -->
  <g font-family="'Space Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif">
    <g text-anchor="end">
      <text x="1140" y="176" font-size="21" font-weight="700" fill="#082F49">vuelco inminente</text>
      <text x="1140" y="220" font-size="21" font-weight="600" fill="#334155">maniobra segura</text>
    </g>
    <g text-anchor="middle" font-size="20" font-weight="600" fill="#334155">
      <text x="160" y="372">Manejo de</text><text x="160" y="396">la carga</text>
      <text x="320" y="372">Velocidad</text><text x="320" y="396">en giros</text>
      <text x="480" y="372">Frenado</text><text x="480" y="396">intempestivo</text>
    </g>
    <g text-anchor="middle" font-size="30" font-weight="700" fill="#082F49">
      <text x="320" y="446">de forma aislada</text>
      <text x="860" y="446">efecto combinatorio</text>
    </g>
  </g>
</svg>
